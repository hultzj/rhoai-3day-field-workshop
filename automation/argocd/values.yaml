# Repository Argo CD syncs the children from (this lab's repo).
gitops:
  repoUrl: https://github.com/hultzj/rhoai-3day-field-workshop.git
  revision: main
  basePath: automation/argocd

argocd:
  namespace: openshift-gitops
  # The field-content workload overrides this to "deployed".
  project: default

lab:
  # The Showroom chart's demo.namespace; the guide derives its own project names (antora.yml).
  namespace: ws-models

# Operators the workshop assumes, installed but not configured (components/platform).
# RHDP order preparation (components/order-prep): enable kserve, modelregistry and trustyai on the
# order's DataScienceCluster and add the GPU node. auto = only when the order injects guid (an RHDP
# order); true or false to force it. The GPU MachineSet it creates is not removed by teardown.
orderPrep:
  enabled: auto
  namespace: ws-order-prep
  values: {}

platform:
  enabled: true
  # Argo CD's destination for the child. Every platform resource names its own namespace, so this
  # one stays empty; it exists so that disabling an operator never leaves the child pointing at a
  # namespace someone else owns.
  namespace: ws-platform
  values: {}

showroom:
  enabled: true
  namespace: workshop-showroom
  # Off: participants are cluster-admins, and the Showroom URL has no login.
  terminal: false
  # Upstream chart, referenced (not copied) and pinned to a commit.
  chart:
    repoUrl: https://github.com/rhpds/field-sourced-content-template.git
    revision: 24ab4baf372d3dbe6b31a7532f8ad8683b5a22c6
    path: examples/helm/components/showroom
  # Unused while terminal is false; pinned anyway so turning it on cannot pull a moving tag.
  terminalImage: quay.io/rhpds/openshift-showroom-terminal-ocp:4.22-2026-09-14-060546@sha256:c0a85c5b62a9081208f44b01dfbe4a411369dbe42079a3d6fe2312824e4a1054

# Injected by the field-content workload (or bootstrap.yaml); do not set here.
deployer:
  domain: ""
  apiUrl: ""

fieldContent:
  deploymentType: helm
