{{- /* An RHDP order injects its form's repo URL as gitops.repoURL; it wins, so children sync the repo the order names. */}}
{{- $repo := .Values.gitops.repoURL | default .Values.gitops.repoUrl }}
{{- define "lab.syncPolicy" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Without this, a sync re-applies fields listed in ignoreDifferences.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- if .Values.platform.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-platform
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ $repo }}
    targetRevision: {{ .Values.gitops.revision | quote }}
    path: {{ .Values.gitops.basePath }}/components/platform
    helm:
      valuesObject:
        {{- toYaml (merge (dict "partOf" .Release.Name) .Values.platform.values) | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.platform.namespace }}
{{- include "lab.syncPolicy" . }}
{{- end }}
{{- /* RHDP order only by default: the order injects guid, make bootstrap does not. */}}
{{- $prep := .Values.orderPrep.enabled }}
{{- if or (eq (toString $prep) "true") (and (eq (toString $prep) "auto") .Values.guid) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-order-prep
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ $repo }}
    targetRevision: {{ .Values.gitops.revision | quote }}
    path: {{ .Values.gitops.basePath }}/components/order-prep
    helm:
      valuesObject:
        {{- toYaml (merge (dict "partOf" .Release.Name "argocdNamespace" .Values.argocd.namespace "namespace" .Values.orderPrep.namespace) .Values.orderPrep.values) | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.orderPrep.namespace }}
{{- include "lab.syncPolicy" . }}
{{- end }}
{{- if .Values.showroom.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-showroom
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.showroom.chart.repoUrl }}
    targetRevision: {{ .Values.showroom.chart.revision | quote }}
    path: {{ .Values.showroom.chart.path }}
    helm:
      valuesObject:
        showroom:
          namespace: {{ .Values.showroom.namespace }}
          content:
            repoUrl: {{ $repo | quote }}
            repoRef: {{ .Values.gitops.revision | quote }}
          terminal:
            enabled: {{ .Values.showroom.terminal }}
            image: {{ .Values.showroom.terminalImage | quote }}
        deployer:
          domain: {{ .Values.deployer.domain | quote }}
        demo:
          namespace: {{ .Values.lab.namespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.showroom.namespace }}
{{- include "lab.syncPolicy" . }}
{{- end }}
