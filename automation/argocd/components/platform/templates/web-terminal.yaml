{{- if .Values.webTerminal.enabled }}
# The console's >_ terminal. Participants run every lab command there, as themselves.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: web-terminal
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  name: web-terminal
  channel: {{ .Values.webTerminal.channel }}
  source: {{ .Values.webTerminal.source }}
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
