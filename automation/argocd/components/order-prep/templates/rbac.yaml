apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
    argocd.argoproj.io/managed-by: {{ .Values.argocdNamespace }}
    demo.redhat.com/application: {{ .Values.partOf }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-prep
  namespace: {{ .Values.namespace }}
---
# Patch the order's DataScienceCluster (cluster-scoped): get, list, patch only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.partOf }}-order-prep
rules:
  - apiGroups: [datasciencecluster.opendatahub.io]
    resources: [datascienceclusters]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.partOf }}-order-prep
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Values.partOf }}-order-prep}
subjects:
  - {kind: ServiceAccount, name: order-prep, namespace: {{ .Values.namespace }}}
{{- if .Values.gpu.enabled }}
---
# Read the worker MachineSets and create the GPU one, in openshift-machine-api only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.partOf }}-order-prep
  namespace: openshift-machine-api
rules:
  - apiGroups: [machine.openshift.io]
    resources: [machinesets]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.partOf }}-order-prep
  namespace: openshift-machine-api
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Values.partOf }}-order-prep}
subjects:
  - {kind: ServiceAccount, name: order-prep, namespace: {{ .Values.namespace }}}
{{- end }}
